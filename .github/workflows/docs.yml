name: docs

# PR gate: offline and deterministic. The book builds from committed bytes, the
# internal-link check never touches the network, generated pages must match
# their sources, and docs claims are machine-checked. Live URL checks live in
# docs-live.yml (nightly + manual) and never block a merge.

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/**"
      - "schemas/**"
      - "deployments.json"
      - "releases/**"
      - "crates/core/src/risk.rs"
      - "crates/cli/**"
      - "crates/wasm/src/lib.rs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / links / pins / claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # gen-cli.py renders the CLI page from the binary's own help output.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # mdBook is pinned; it is a build tool, not a site dependency.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: mdbook-cache
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4-${{ runner.os }}
      - name: install mdbook 0.5.4
        run: |
          if ! command -v mdbook >/dev/null 2>&1; then
            cargo install mdbook --version 0.5.4 --locked
          fi
          mdbook --version

      - name: regenerate generated pages
        working-directory: docs-site
        run: |
          python3 scripts/gen-risk-rules.py
          python3 scripts/gen-cli.py
          python3 scripts/gen-api.py
          python3 scripts/gen-evidence.py
          python3 scripts/gen-upstream.py

      # A generated page that changed means the committed page disagreed with
      # its source file. Fail, and ask for the regenerated page in the PR.
      - name: generated pages are current
        run: |
          git diff --exit-code -- docs-site/src/generated
          test -z "$(git status --porcelain -- docs-site/src/generated)"

      - name: internal links (offline)
        working-directory: docs-site
        run: python3 scripts/check-links.py

      - name: docs claims (offline)
        working-directory: docs-site
        run: python3 scripts/check-docs-claims.py

      - name: build the book
        working-directory: docs-site
        run: mdbook build

      - name: no external script or font in the built site
        working-directory: docs-site
        run: |
          if grep -rEo 'src="https?://[^"]+"' book --include='*.html' | grep -v '^$'; then
            echo "FAIL: external script referenced by the built site"; exit 1
          fi
          if grep -rEo '@import[^;]*url\(["'"'"']?https?://' book/css --include='*.css'; then
            echo "FAIL: external font or stylesheet imported"; exit 1
          fi
          echo "no external assets"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs-site/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
