name: live-checks

# Live tier (process rule 2): testnet claims and fixture checks. NOT part of
# the PR gate — deliberately allowed to fail without blocking merges. On
# failure it opens/updates a single tracking issue with the re-seed command.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: live tier (testnet claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Offline negative test of the fixture-events outcome logic: a fixture
      # inside retention with no events must fail, never quietly expire.
      - name: self-test the fixture-events checker
        run: bash scripts/check-fixture-events.sh --self-test
      - name: run online claims
        id: claims
        run: ONLINE_ONLY=1 bash scripts/check-claims.sh
      # Process rule 5: fixture contracts must stay alive. Check EVERY contract
      # registered in deployments.json, not just the phase 1 fixture: TTL reads
      # are public (getLedgerEntries), so no secrets are needed here.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: registered contract TTL check
        run: |
          cargo build -p soroban-governance-cli
          # Expired fixtures (liveUntilLedger 0) are loud warnings carrying the
          # re-seed command: refreshing them needs the funded deployer key.
          # Unreadable contracts and an empty registry still fail this step.
          bash scripts/check-contract-ttls.sh
      # Seed-v2 contracts live in the gitignored .seed/ working area, so this
      # step is a no-op on hosted CI and active only on a self-hosted soak
      # runner that carries .seed/. It keeps every seed contract alive and
      # generates real on-chain activity for the indexer.
      - name: seed-v2 TTL + activity (self-hosted soak runner only)
        if: ${{ hashFiles('.seed/state.json') != '' }}
        run: |
          bash scripts/ttl/extend-seed-contracts.sh
          (cd scripts/seed-v2 && npm ci && node ../activity/activity.js --once)
      - name: report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Live-tier checks failed at $(date -u +%FT%TZ) in run ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Usual cause: testnet reset, RPC change, or contract TTL expiry.
          Re-seed: bash scripts/prove-phase1.sh (re-deploys the fixture governor and re-captures proofs), then re-run this workflow via the Actions tab.
          TTL-only fix: bash scripts/ttl/extend-fixture-ttl.sh (idempotent, extends instance + code)."
          num=$(gh issue list --state open --search "live-tier checks failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "live-tier checks failed" --body "$body" --label bug
          fi
