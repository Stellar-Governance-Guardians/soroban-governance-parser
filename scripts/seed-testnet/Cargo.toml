[package]
name = "sgg-fixture-governor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Testnet fixture generator contract for parser proofs. Governance-shaped events mirroring the verified Script3 topic shapes (docs/adapters/script3.md). NOT a production governor, NOT an adapter test oracle."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
incremental = false
lto = true

[workspace]
