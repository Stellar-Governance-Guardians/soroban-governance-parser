[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Stellar-Governance-Guardians/soroban-governance-parser"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"

# Verified latest stable on crates.io 2026-10-05
stellar-xdr = { version = "28.0.1", default-features = false, features = ["std", "serde", "base64"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Deliberate relaxations within pedantic: doc style and must_use noise do not
# affect correctness; unwrap/expect/panic remain denied.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
opt-level = "s"
