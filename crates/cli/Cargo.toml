[package]
name = "soroban-governance-cli"
description = "CLI for decoding Soroban governance payloads: ScVal decoding, contractspecv0 extraction, live testnet spec fetching."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sgp"
path = "src/main.rs"

[dependencies]
soroban-governance-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
stellar-xdr.workspace = true
stellar-strkey = "0.0.13"
thiserror.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
base64 = "0.22"

[lints]
workspace = true
